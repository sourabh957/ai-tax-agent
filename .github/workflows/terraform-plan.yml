name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/terraform/**"

jobs:
  plan:
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write   # to post plan as PR comment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Terraform init
        run: terraform init -input=false
        working-directory: infra/terraform/environments/dev

      - name: Terraform validate
        run: terraform validate
        working-directory: infra/terraform/environments/dev

      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -input=false \
            -no-color \
            -out=tfplan \
            2>&1 | tee plan_output.txt
        working-directory: infra/terraform/environments/dev

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/environments/dev/plan_output.txt', 'utf8');
            const maxLength = 60000;
            const truncated = plan.length > maxLength
              ? plan.substring(0, maxLength) + '\n\n... (truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan (dev)\n\`\`\`\n${truncated}\n\`\`\`\n\n⚠️ **Review before merging. Never auto-apply.**`
            });
