name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Job 1: Application tests ──────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run configuration check
        run: python -m app.core.config_check
        continue-on-error: true   # warn only — no live services in CI

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ \
            --tb=short \
            -q \
            --no-header \
            --junitxml=test-results/unit.xml

      - name: Run agent integration tests
        run: |
          python -m pytest tests/agent/ tests/integration/ \
            --tb=short \
            -q \
            --no-header \
            --junitxml=test-results/integration.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  # ── Job 2: Terraform validation ───────────────────────────────────────────
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Terraform init (dev)
        run: terraform init -backend=false -input=false
        working-directory: infra/terraform/environments/dev

      - name: Terraform validate (dev)
        run: terraform validate
        working-directory: infra/terraform/environments/dev

  # ── Job 3: Docker build check ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ai-tax-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
