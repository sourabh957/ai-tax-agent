version: "3.9"

# Production Docker Compose for EC2 Spot instance deployment
# Run with: docker compose -f docker-compose.prod.yml up -d
# All secrets come from environment — never hardcoded here

services:
  backend:
    image: ${ECR_BACKEND_URI}:${IMAGE_TAG:-latest}
    container_name: taxly-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"     # Nginx proxies to this — NOT exposed to internet
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      AWS_REGION: ${AWS_REGION}
      LLM_PROVIDER: bedrock
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      MAX_AGENT_ITERATIONS: ${MAX_AGENT_ITERATIONS:-8}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-10}
      MAX_LLM_CALLS: ${MAX_LLM_CALLS:-6}
      DAILY_REQUEST_LIMIT: ${DAILY_REQUEST_LIMIT:-20}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://yourdomain.com}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      # OIDC_CLIENT_SECRET and JWT_SECRET_KEY come from EC2 instance profile → Secrets Manager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-group: /ec2/taxly-prod
        awslogs-region: ${AWS_REGION}
        awslogs-stream-prefix: backend

  frontend:
    image: ${ECR_FRONTEND_URI}:${IMAGE_TAG:-latest}
    container_name: taxly-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"     # Nginx proxies to this — NOT exposed to internet
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN_NAME}
      NEXT_PUBLIC_APP_NAME: Taxly
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: awslogs
      options:
        awslogs-group: /ec2/taxly-prod
        awslogs-region: ${AWS_REGION}
        awslogs-stream-prefix: frontend
